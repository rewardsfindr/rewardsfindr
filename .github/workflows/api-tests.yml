name: API Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No npm cache: api/ has no package-lock.json (same as test.yml API job).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: api

      - name: Run tests
        run: npm test
        working-directory: api
